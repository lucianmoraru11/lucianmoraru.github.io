<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Valentina mea 💖</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
        }

        .card {
            background: white;
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #ff4d6d;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
        }

        #yes {
            background-color: #ff4d6d;
            color: white;
        }

        #no {
            background-color: #ccc;
            position: absolute;
        }

        #message {
            margin-top: 20px;
            font-size: 22px;
            color: #ff4d6d;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Vrei să fii valentina mea? </h1>
        <button id="yes" onclick="sayYes()">DA </button>
        <button id="no" onmouseover="moveNo()">NU </button>
        <div id="message">Te iubesc Mirelusha!  Abia aștept 14 februarie </div>
    </div>

    <script>
        function moveNo() {
            const noBtn = document.getElementById("no");
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

        function sayYes() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
